[project]
name = "ace-agent-kit"
version = "0.2.0"
description = "Shared kit for ACE and ODT team agents: agent config context (ENV + Key Vault lookup), context envelope, capability client, prompts, cross-agent delegation over A2A"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.1.2",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ace_agent_kit"]
