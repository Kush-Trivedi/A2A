# UAT — same keys as local; secrets resolve from the TEAM'S Key Vault via lookup:.
server:
  host: "0.0.0.0"
  port: 3999

ace:
  base_url: "https://your_uat_ace_url"
  public_url: "https://your_uat_agent_url"
  permission: "chat"
  allowed_roles:
    - "developer"
  registration_token: "lookup:agent-registration-token"

auth:
  enabled: true
  tenant_id: "your_tenant_id"
  audience: "your_agent_app_id_uri"
  authority: "https://login.microsoftonline.com"
  issuer: ""
  jwks_url: ""

llm:
  default: "chat"
  deployments:
    chat: "your_uat_deployment_name"

retrieval:
  enabled: false
  mode: "hybrid"
  knowledge_sources: []

connections:
  sharepoint:
    enabled: false
    connection: ""
  storage_blob:
    enabled: false
    connection: ""
  databricks:
    enabled: false
    connection: ""
    genie_space: ""
  twilio:
    enabled: false
    connection: ""

channels:
  ui:
    enabled: true
  teams:
    enabled: false
    webhook_secret: "lookup:teams-webhook-secret"
  sms:
    enabled: false
    inbound: false
    outreach: false

azure:
  managed_identity_client_id: "your_managed_identity_client_id"
  keyvault:
    keyvault_url: "your_team_keyvault_url"
    keyvault_secret_prefix: ""
