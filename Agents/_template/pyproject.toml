[project]
name = "your-agent"
version = "0.1.0"
description = "Team agent scaffold - copy, rename, and own it"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "ace-agent-kit>=0.2.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
]

# IN THE MONOREPO: the kit resolves from the local path below.
# IN YOUR TEAM'S OWN Azure DevOps REPO: delete [tool.uv.sources] and add your
# Azure Artifacts feed instead, then `uv add ace-agent-kit`:
#
#   [[tool.uv.index]]
#   name = "ace-artifacts"
#   url = "https://pkgs.dev.azure.com/<org>/_packaging/<feed>/pypi/simple/"
#
[tool.uv.sources]
ace-agent-kit = { path = "../../agent_kit", editable = true }
