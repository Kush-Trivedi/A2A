# Team-owned agent manifest — Pay Ops.
agent:
  team_key: "pay_ops"
  agent_key: "blob_qa"
  display_name: "Claims Archive Agent"
  description: "Answers from the Pay Ops claims document archive (blob storage) only."
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 3600

skills:
  - id: "claims_document_answering"
    name: "Claims document answering"
    description: "Answer questions grounded ONLY in the ingested claims archive."
    tags: ["blob", "claims", "documents"]
    examples:
      - "What does the appeal guideline say about denial code CO-97?"

# Team-owned: the storage location phase-A ingestion loads from (used when
# calling /api/v1/knowledge/ingest/blob).
data:
  blob:
    container: "claims-archive"
    prefix: "guidelines/"

delegations: {}

auth:
  enabled: false
  tenant_id: "your_tenant_id"
  audience: "your_agent_app_id_uri"
  authority: "https://login.microsoftonline.com"
  issuer: ""
  jwks_url: ""

ace:
  base_url: "http://localhost:3000"
  public_url: "http://localhost:3600"
  permission: "chat"
  allowed_roles:
    - "developer"
    - "nurse"
  retrieval_mode: "sparse"
  knowledge_sources:
    - "blob:claims"
