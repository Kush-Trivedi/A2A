# ENV-INVARIANT manifest — HR Benefits team. Runtime values: config/env/<ENV>.yaml
agent:
  team_key: "hr_benefits"
  agent_key: "benefits"
  display_name: "Benefits Agent"
  description: "Answers employee benefits questions (plans, enrollment, coverage) from the ingested benefits knowledge base. Also available in Microsoft Teams."
  version: "1.0.0"

skills:
  - id: "benefits_question_answering"
    name: "Benefits question answering"
    description: "Answer employee questions about benefits plans, enrollment windows, dental/vision/medical coverage, and dependents."
    tags: ["benefits", "hr", "enrollment", "coverage"]
    examples:
      - "When is open enrollment?"
      - "Does my plan cover dental?"
      - "How do I add my spouse to my insurance?"
      - "What is the difference between the PPO and HMO plans?"

prompts:
  system:
    version: "1.0.0"
    content: |
      You are {display_name} for hospital employees. Answer ONLY benefits
      questions from the documents provided in context, citing sources. For
      anything else, direct the user to the right assistant.
  fallback:
    version: "1.0.0"
    content: |
      [{display_name}] I can help with benefits plans, enrollment windows, and
      coverage questions. You asked: {question}.

delegations: {}
