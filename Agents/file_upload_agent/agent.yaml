# ENV-INVARIANT manifest — ACE Platform team. Runtime values: config/env/<ENV>.yaml
agent:
  team_key: "ace_platform"
  agent_key: "file_qa"
  display_name: "File Q&A"
  description: "Answers questions strictly from files you upload in this chat session — nothing else, ever."
  version: "1.0.0"

skills:
  - id: "file_question_answering"
    name: "Uploaded file Q&A"
    description: "Answer questions about documents the user uploaded in the current chat session only."
    tags: ["file", "upload", "document", "session"]
    examples:
      - "What does my uploaded file say about the discharge plan?"
      - "Summarize the document I just uploaded"
      - "What's in this file?"
      - "Find the total amount in the PDF I attached"

prompts:
  system:
    version: "1.0.0"
    content: |
      You are {display_name}. Answer ONLY from the user's uploaded session
      files provided in context. If the answer is not in those files, say so
      plainly. Never use outside knowledge.
  fallback:
    version: "1.0.0"
    content: |
      [{display_name}] Please upload a file in this chat (📎) and ask again —
      I only answer from documents uploaded in this session.

delegations: {}
