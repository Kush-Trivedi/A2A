# Team-owned agent manifest — Clinical Care.
agent:
  team_key: "clinical_care"
  agent_key: "sharepoint_qa"
  display_name: "Policy Library Agent"
  description: "Answers from the Clinical Care SharePoint policy library only."
  version: "0.1.0"

server:
  host: "0.0.0.0"
  port: 3500

skills:
  - id: "policy_question_answering"
    name: "Policy question answering"
    description: "Answer questions grounded ONLY in the ingested SharePoint policy library."
    tags: ["sharepoint", "policies", "documents"]
    examples:
      - "What is the visitor policy for the ICU?"

# Team-owned: which SharePoint content phase-A ingestion loaded, and where
# it came from (site/drive are used by the team when calling
# /api/v1/knowledge/ingest/sharepoint).
data:
  sharepoint:
    site_path: "/sites/clinical-care"
    drive_name: "Documents"
    folder_path: "Policies"

delegations: {}

auth:
  enabled: false
  tenant_id: "your_tenant_id"
  audience: "your_agent_app_id_uri"
  authority: "https://login.microsoftonline.com"
  issuer: ""
  jwks_url: ""

ace:
  base_url: "http://localhost:3000"
  public_url: "http://localhost:3500"
  permission: "chat"
  allowed_roles:
    - "developer"
    - "nurse"
  retrieval_mode: "sparse"
  knowledge_sources:
    - "sharepoint:policies"
