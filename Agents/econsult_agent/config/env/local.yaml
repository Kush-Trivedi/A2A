# LOCAL — same keys as dev/uat/prd; only VALUES differ.
server:
  host: "0.0.0.0"
  port: 3900

ace:
  base_url: "http://localhost:3000"
  public_url: "http://localhost:3900"
  permission: "chat"
  allowed_roles:
    - "developer"
    - "nurse"
  registration_token: "your_registration_token"

auth:
  enabled: false
  tenant_id: "your_tenant_id"
  audience: "your_agent_app_id_uri"
  authority: "https://login.microsoftonline.com"
  issuer: ""
  jwks_url: ""

llm:
  default: "chat"
  deployments:
    chat: "your_deployment_name"

retrieval:
  enabled: true
  mode: "sparse"
  knowledge_sources:
    - "sharepoint:econsult"

connections:
  sharepoint:
    enabled: true
    connection: "clinical_sharepoint"
  storage_blob:
    enabled: false
    connection: ""
  databricks:
    enabled: false
    connection: ""
    genie_space: ""
  twilio:
    enabled: false
    connection: ""

channels:
  ui:
    enabled: true
  teams:
    enabled: false
    webhook_secret: "your_teams_webhook_secret"
  sms:
    enabled: false
    inbound: false
    outreach: false

azure:
  managed_identity_client_id: ""
  keyvault:
    keyvault_url: ""
    keyvault_secret_prefix: ""
