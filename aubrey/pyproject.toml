[project]
name = "aubrey"
version = "0.1.0"
description = "Aubrey - the minimal ACE control plane core: Entra login, auto role assignment, Casbin, team/agent registry"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.1.2",
    "asyncpg>=0.31.0",
    "azure-identity>=1.25.3",
    "azure-keyvault-secrets>=4.11.0",
    "azure-storage-blob>=12.30.0",
    "casbin>=1.43.0",
    "casbin-async-sqlalchemy-adapter>=1.17.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "markitdown[all]==0.1.7",
    "openai>=2.53.0",
    "pyjwt[crypto]>=2.13.0",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
# markitdown[all] depends on azure-ai-contentunderstanding, which only ships
# pre-releases (uv's own hint: --prerelease=allow). Same resolution ACE uses.
prerelease = "allow"
