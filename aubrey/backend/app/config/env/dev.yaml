config: {}

server:
  host: "0.0.0.0"
  port: 3000
  reload: false
  workers: 2  # uvicorn processes; scale out replicas beyond this

database:
  postgres:
    host: "localhost"
    dbname: "your_dbname"
    port: 5432
    user: "your_username"
    password: "lookup:postgres-password"
    timeout: 300
    auth_mode: "password"
    pool_size: 10
    max_overflow: 20
    ssl_mode: "disable"

microsoft:
  entra:
    oauth_enabled: true
    jwt_auth_enabled: true
    tenant_id: "your_tenant_id"
    client_id: "your_client_id"
    client_secret: "lookup:entra-client-secret"
    redirect_uri: "https://your_dev_url/api/auth/callback/microsoft"
    post_logout_redirect_uri: "https://your_dev_url/docs"
    post_login_redirect_uri: "https://your_dev_url/docs"
    scopes: "your_scope"
    api_audience: "your_api_audience"
    refresh_token_backend: "memory"
    refresh_token_ttl_seconds: 2592000
  # Platform app registration + the tenant-wide SharePoint host. WHERE data
  # lives (sites/drives, storage accounts) is per-team via /admin/connections.
  sharepoint:
    tenant_id: "your_sharepoint_tenant_id"
    client_id: "your_sharepoint_client_id"
    client_secret: "lookup:sharepoint-client-secret"
    hostname: "your_org.sharepoint.com"
  azure:
    managed_identity_client_id: ""
    azure_foundry:
      base_endpoint: "your_base_endpoint"
      api_key: "lookup:foundry-api-key"
      timeout_seconds: 30
      embedding:
        deployment: "your_embedding_deployment"
        api_version: "your_api_version"
        embedding_dimensions: 3072
      text_completion:
        deployment: "your_chat_deployment"
        api_version: "your_api_version"
        max_tokens: 2048
    keyvault:
      keyvault_url: "your_keyvault_url"
      keyvault_secret_prefix: ""

security:
  entra_authority: "https://login.microsoftonline.com"
  graph_endpoint: "https://graph.microsoft.com/v1.0"
  log_identity_claims: false
  identity_claim_names: []
  session:
    cookie_name: "aubrey_session"
    ttl_seconds: 2592000
    secret: ""
    cookie_secure: true
    cookie_samesite: "lax"
  cors:
    allowed_origins:
      - "https://your_dev_url"
      - "http://localhost:5173"
    allow_credentials: true

authorization:
  rbac_enabled: true
  rbac_model_path: ""
  policy_reload_seconds: 300
  full_access_roles:
    - "developer"

# Retrieval numbers live here (env config), never as code constants.
knowledge:
  retrieval:
    mode: "hybrid"              # dense | sparse | hybrid (RRF fusion)
    top_k: 8
    candidates: 32
    min_similarity: 0.25
    rrf_k: 60
    neighbor_window: 1
    neighbor_decay: 0.9
    graph:                      # 1-hop GraphRAG expansion
      enabled: true
      entity_top_k: 5
      entity_min_similarity: 0.45
      hop_decay: 0.7

# Agent-facing platform config; router keys join this section at M3.
agents:
  memory:
    # conversation window (tokens) sent to agents each turn; a team manifest
    # can lower it per agent later
    window_tokens: 2000
  a2a:
    request_timeout_seconds: 120
    streaming_enabled: true
    card_cache_ttl_seconds: 300
  router:
    mode: "dense"         # embedding cosine over registered utterances
    threshold: 0.42
    sparse_threshold: 0.03
    margin: 0.06
    sparse_ambiguity_ratio: 0.8
    switch_margin: 0.12
    overlap_threshold: 0.86
    fallback_agent: "general"
    utterance_cap: 32

# Platform SMS channel (Twilio). The inbound number is channel infra and
# platform-owned; campaigns bind it to team agents. sms.default_campaign
# handles cold inbound texts ("" = store only, never dispatch).
twilio:
  account_sid: "your_twilio_account_sid"
  auth_token: "your_twilio_auth_token"
  phone_number: "your_twilio_phone_number"
  messaging_service_sid: ""
  webhook_base_url: ""
  validate_signatures: true
  timeout_seconds: 15
  tenant_id: "default"   # MUST match your Entra tenant id (what /auth/me shows) or campaigns will not resolve
  sms:
    user_role: "sms_user"
    default_campaign: ""
    max_length: 480
    window_tokens: 600
    status_callbacks_enabled: true
    rate_limit_per_minute: 6
    media_reply: "Sorry, this number can't receive pictures or attachments - please send your question as text."
    outreach_instruction: "Compose the outreach SMS for this recipient.
Recipient context:
{context}"

# Databricks data plane. Workspace credentials are platform-held (PAT in
# every env — standing decision); WHICH space/warehouse a query uses is
# team-owned via /admin/connections (source_type genie | databricks_sql,
# config.workspace names a key below). Serverless warehouses strongly
# recommended: 2-6s start vs ~4 min classic cold start.
databricks:
  workspaces:
    primary:
      host: "your_databricks_host"
      token: "your_databricks_pat"
  data:
    poll_initial_seconds: 1.0
    poll_max_seconds: 5.0
    max_wait_seconds: 90
    statement_wait_timeout: "50s"
    max_result_rows: 100
    text2sql:
      schema_cache_ttl_seconds: 600
      repair_attempts: 1
      max_output_tokens: 800
      prompt_template: "You translate questions into a single Databricks SQL SELECT statement over the tables below. Use ONLY these tables and columns.

Schema:
{schema}

Examples:
{examples}

Rules: return ONLY the SQL statement, no explanation, no markdown. If the question cannot be answered from these tables, return exactly: NO_QUERY: <one short reason>."
