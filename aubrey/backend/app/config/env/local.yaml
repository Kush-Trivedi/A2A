config: {}

server:
  host: "0.0.0.0"
  port: 3000
  reload: false
  workers: 1  # uvicorn processes; scale out replicas beyond this

database:
  postgres:
    host: "localhost"
    dbname: "your_dbname"
    port: 5432
    user: "your_username"
    password: "your_password"
    timeout: 300
    auth_mode: "password"
    pool_size: 10
    max_overflow: 20
    ssl_mode: "disable"

microsoft:
  entra:
    oauth_enabled: true
    jwt_auth_enabled: true
    tenant_id: "your_tenant_id"
    client_id: "your_client_id"
    client_secret: "your_client_secret"
    redirect_uri: "http://localhost:3000/api/auth/callback/microsoft"
    post_logout_redirect_uri: "http://localhost:3000/docs"
    post_login_redirect_uri: "http://localhost:3000/docs"
    scopes: "your_scope"
    api_audience: "your_api_audience"
    refresh_token_backend: "memory"
    refresh_token_ttl_seconds: 2592000
  # Platform app registration + the tenant-wide SharePoint host. WHERE data
  # lives (sites/drives, storage accounts) is per-team via /admin/connections.
  sharepoint:
    tenant_id: "your_sharepoint_tenant_id"
    client_id: "your_sharepoint_client_id"
    client_secret: "your_sharepoint_client_secret"
    hostname: "your_org.sharepoint.com"
  azure:
    managed_identity_client_id: ""
    azure_foundry:
      base_endpoint: "your_base_endpoint"
      api_key: "your_api_key"
      timeout_seconds: 30
      embedding:
        deployment: "your_embedding_deployment"
        api_version: "your_api_version"
        embedding_dimensions: 3072
      text_completion:
        deployment: "your_chat_deployment"
        api_version: "your_api_version"
        max_tokens: 2048
    keyvault:
      keyvault_url: ""
      keyvault_secret_prefix: ""

security:
  entra_authority: "https://login.microsoftonline.com"
  graph_endpoint: "https://graph.microsoft.com/v1.0"
  # Field-level encryption at rest for memory content (AES-256-GCM).
  # base64-encoded 16/24/32-byte key; cloud envs should point at Key Vault
  # via lookup:. Placeholder = PLAINTEXT PASSTHROUGH with a startup warning
  # (acceptable for local dev only).
  field_encryption:
    key: "your_field_encryption_key"
  # Envelope signing (M10-S3): HMAC-SHA256 over the capability-plane
  # context envelope (identity + delegation chain) so agents cannot mint
  # identities. base64 key, 16+ bytes (32 recommended); cloud envs should
  # point at Key Vault via lookup:. Placeholder = signing DISABLED —
  # capability endpoints accept unsigned envelopes (local dev only).
  envelope_signing:
    key: "your_envelope_signing_key"
    max_age_seconds: 300
  log_identity_claims: false
  identity_claim_names: []
  session:
    cookie_name: "aubrey_session"
    ttl_seconds: 2592000
    secret: ""
    cookie_secure: false
    cookie_samesite: "lax"
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allow_credentials: true

authorization:
  rbac_enabled: true
  rbac_model_path: ""
  policy_reload_seconds: 300
  # Entra ADMIN groups -> team key: members of the group administer that
  # team's dashboard (register team, issue tokens, onboard agents). Fill
  # with your real group names, e.g. "ADM_IIAI_Platform_MyAdmin": "platform"
  admin_group_teams: {}
  full_access_roles:
    - "developer"

# Retrieval numbers live here (env config), never as code constants.
knowledge:
  retrieval:
    mode: "sparse"              # local: full-text only (no model creds); cloud envs run hybrid
    top_k: 8
    candidates: 32
    min_similarity: 0.25
    rrf_k: 60
    neighbor_window: 1
    neighbor_decay: 0.9
    graph:                      # 1-hop GraphRAG expansion (needs the embedding endpoint)
      enabled: false
      entity_top_k: 5
      entity_min_similarity: 0.45
      hop_decay: 0.7

# Agent-facing platform config; router keys join this section at M3.
agents:
  memory:
    # conversation window (tokens) sent to agents each turn; a team manifest
    # can lower it per agent later
    window_tokens: 2000
    summary_tokens: 300            # rolling session summary output cap
    facts_top_k: 5                 # semantic facts recalled per turn
    episodes_top_k: 3              # past-session episodes recalled per turn
    layer_timeouts_ms: 250         # per-layer recall deadline (int, or map layer->ms)
    decay_interval_seconds: 21600  # background decay + session-purge cadence
    decay_floor: 0.05              # memory records below this weight are pruned
    window_recent_turns: 6         # working memory: the last N turns always ride
    window_semantic_top_k: 4       # working memory: older turns recalled by cosine
    extraction_max_facts: 5        # cap on facts mined from one turn
    layers_enabled: [working, semantic, episodic, prospective]
    prospects_top_k: 3             # prospective commitments recalled per turn
    prospect_horizon_days: 7       # recall prospects due within this window (or past-due)
    prospect_stale_days: 30        # decay cancels open prospects this far past due
    episodic_min_turns: 4          # first episode once a session reaches N messages
    episodic_every_turns: 8        # then one episode every N further messages
    # External subjects (§8.3): campaign recipients (sms:/voice: user ids).
    # working-only = long-term memory commits are a structural no-op until a
    # campaign opts layers in ("summary" is the rolling-summary pseudo-layer).
    external:
      layers_enabled: [working]
      facts_allowlist: []          # regex list; empty = external facts never stored
      retention_days: 30           # external facts/episodes countdown (retention sweep)
    half_life_days:
      facts: 90
      episodes: 60
    redaction:
      # kind: regex, merged OVER built-in defaults (ssn, phone, email,
      # credit_card, mrn, credential). Kinds in drop_kinds reject the whole
      # record (never stored); every other match becomes [REDACTED-<kind>].
      patterns: {}
      drop_kinds: [credential]
    summary_prompt: "You maintain a rolling summary of a conversation. Fold the new turns into the current summary: keep goals, decisions, and open questions; drop pleasantries; never invent details. Return ONLY the updated summary as plain text.

Current summary:
{summary}

New turns:
{turns}"
    extraction_prompt: "Extract stable, reusable facts about the user or their domain from this exchange (preferences, identifiers already redacted, ongoing matters). Ignore one-off phrasing and anything speculative. Return ONLY a JSON array of short fact strings; return [] when nothing qualifies.

User: {question}

Assistant: {answer}"
  a2a:
    request_timeout_seconds: 120
    streaming_enabled: true
    card_cache_ttl_seconds: 300
    # M5 delegation (POST /capability/agents/resolve). Agent manifests
    # declare their peers; the platform holds no manifests, so `allowed`
    # MIRRORS those declarations: caller agent_key -> [peer agent_keys].
    # Empty map = delegation off. max_depth caps len(delegated_from).
    delegation:
      max_depth: 2
      allowed: {}            # e.g. general: [benefit, policy_procedure]
  router:
    mode: "sparse"        # full-text only - no model credentials needed locally
    threshold: 0.42       # dense dispatch floor (cosine)
    sparse_threshold: 0.03
    margin: 0.06
    sparse_ambiguity_ratio: 0.8
    switch_margin: 0.12
    overlap_threshold: 0.86
    fallback_agent: "general"
    utterance_cap: 32
    collision_blocking: true    # block activation when skills overlap an active agent
    contextualizer:
      enabled: true             # rewrite follow-ups to standalone questions pre-routing
      model: ""                 # fast/cheap deployment for the rewrite (""=default chat model)
      min_chars_to_skip: 60     # questions this long with no follow-up markers skip the rewrite
      max_output_tokens: 200
    judge_enabled: false
    judge_model: ""             # fast/cheap deployment for the arbiter (""=default)          # sparse local runs credential-less - no LLM judge
    judge_band: 0.08              # cosine band around threshold/margin ties that wakes the judge
    # judge_prompt placeholders: {question} {candidates}
    judge_prompt: |
      You are the routing judge for a multi-agent assistant. The scored
      candidates for the user's question are too close to call. Pick the
      ONE agent best suited to answer, or ASK if only the user can
      resolve it.

      Candidates (key: what the agent covers):
      {candidates}

      Question: {question}

      Reply with EXACTLY one token: the chosen agent key, or ASK.
    thresholds_per_agent: {}      # per-agent dispatch floors (dense cosine), e.g. {benefit: 0.5}; empty = global threshold
    sticky_decay_per_turn: 0.02   # switch margin shrinks per turn since the sticky agent last answered
    feedback_weight: 0.1          # score adjustment per unit of decayed feedback mass
    feedback_min_similarity: 0.78 # feedback rows below this cosine to the question contribute nothing
    feedback_half_life_days: 30   # feedback mass decays 0.5^(age_days/half_life)
    feedback_cap: 0.15            # |adjustment| ceiling per agent
    feedback_recent_n: 500        # scan only this many newest feedback rows (plain scan, no ANN index)
    negative_markers:             # case-insensitive answer PREFIXES meaning "wrong agent" (not_supported/no_data stems)
      - "the data source returned no rows"
      - "the contract data returned no rows"
      - "that question is outside"

# Platform SMS channel (Twilio). The inbound number is channel infra and
# platform-owned; campaigns bind it to team agents. sms.default_campaign
# handles cold inbound texts ("" = store only, never dispatch).
twilio:
  account_sid: "your_twilio_account_sid"
  auth_token: "your_twilio_auth_token"
  phone_number: "your_twilio_phone_number"
  messaging_service_sid: ""
  webhook_base_url: ""
  validate_signatures: false   # local dev only — cloud envs fail closed
  timeout_seconds: 15
  tenant_id: "default"   # MUST match your Entra tenant id (what /auth/me shows) or campaigns will not resolve
  sms:
    user_role: "sms_user"
    default_campaign: ""
    max_length: 480
    window_tokens: 600
    status_callbacks_enabled: true
    rate_limit_per_minute: 6
    media_reply: "Sorry, this number can't receive pictures or attachments - please send your question as text."
    outreach_instruction: "Compose the outreach SMS for this recipient.
Recipient context:
{context}"

# Databricks data plane. Workspace credentials are platform-held (PAT in
# every env — standing decision); WHICH space/warehouse a query uses is
# team-owned via /admin/connections (source_type genie | databricks_sql,
# config.workspace names a key below). Serverless warehouses strongly
# recommended: 2-6s start vs ~4 min classic cold start.
databricks:
  workspaces:
    primary:
      host: "your_databricks_host"
      token: "your_databricks_pat"
  data:
    poll_initial_seconds: 1.0
    poll_max_seconds: 5.0
    max_wait_seconds: 90
    statement_wait_timeout: "50s"
    max_result_rows: 100
    text2sql:
      schema_cache_ttl_seconds: 600
      repair_attempts: 1
      max_output_tokens: 800
      prompt_template: "You translate questions into a single Databricks SQL SELECT statement over the tables below. Use ONLY these tables and columns.

Schema:
{schema}

Examples:
{examples}

Rules: return ONLY the SQL statement, no explanation, no markdown. If the question cannot be answered from these tables, return exactly: NO_QUERY: <one short reason>."

# Data retention clocks (M10-S2). Sweeps run on the memory decay interval
# (agents.memory.decay_interval_seconds); every purge/overwrite writes a
# deletion_evidence row. 0 disables a policy.
retention:
  archived_session_days: 30      # archived chat sessions -> hard delete (FK cascade)
  sms_message_days: 365          # SMS bodies + vendor_details overwritten; ledger kept
  genie_conversation_days: 90    # stale genie thread mappings deleted
