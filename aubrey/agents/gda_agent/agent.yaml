agent:
  key: "gda_agent"
  team_key: "data-analytics"
  display_name: "GDA Assistant"
  description: "Answers questions live from the team's Databricks data via Genie and generates draft appeals grounded on the retrieved records — volumes, trends, denials, claim details"
  version: "0.1.0"
  permission: "chat"
  allowed_roles: ["developer"]
  skills:
    - id: "data_answers"
      name: "Live data answers"
      description: "Answers analytical questions against the team's Databricks data via Genie: volumes, trends, metrics, breakdowns, claim and denial lookups"
      examples:
        - "How many claims were denied last month?"
        - "Show denial reasons by payer for this quarter"
        - "What is the average appeal turnaround time?"
    - id: "draft_appeal"
      name: "Draft appeal generation"
      description: "Generates a draft appeal letter grounded on the claim or denial record the user selects or describes"
      examples:
        - "Generate a draft appeal for claim CLM-10023"
        - "Draft an appeal for this denied claim"
        - "Write the appeal letter for the selected denial"

server:
  host: "0.0.0.0"
  port: 8111
  public_url: "http://localhost:8111"

aubrey:
  base_url: "http://localhost:3000"

settings:
  data:
    mode: "ask"                     # ask = fast text-to-SQL | genie
    sql_connection: "gda-sql"       # databricks_sql connection (ask mode)
    genie_connection: "gda-genie"   # genie connection (genie mode)
    examples: []                    # few-shot Q→SQL pairs — add the team's
  max_table_rows: 20                # rows shown in the answer context

prompts:
  system:
    version: "1.0.0"
    content: |
      You are {display_name}. You answer using live Databricks results
      provided in context ONLY — never invent numbers, names or records.
      Present the direct answer first, concisely; mention the row count
      when a table is included. If the user asks for a draft appeal,
      follow the draft instructions exactly, grounded only on the
      retrieved record.
  draft_appeal:
    version: "1.0.0"
    content: |
      Draft appeal structure: a professional appeal letter with (1) claim
      identification, (2) a factual summary of the denial from the data,
      (3) the grounds for appeal based only on the record, (4) requested
      action. Mark any field the data does not provide as [MISSING] —
      never fabricate patient, provider or payer details.
  data_context:
    version: "1.0.0"
    content: |
      Live data result (generated SQL and rows from Databricks):
      SQL: {sql}
      Rows ({row_count}{truncated_note}):
      {table}
  no_data:
    version: "1.0.0"
    content: |
      The data source returned no rows for that question. Try rephrasing
      with the metric, time range or identifier — or the data may not be
      in this team's space yet.
  not_answerable:
    version: "1.0.0"
    content: |
      That question can't be answered from the data I have ({reason}).
      I can help with claims, denials and appeal metrics — or generate a
      draft appeal for a specific claim.
