[project]
name = "aubrey-agents"
version = "0.1.0"
description = "Aubrey team agents + shared kit (A2A servers; no DB, no model keys - everything via aubrey's capability plane)"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.1.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sse-starlette>=2.1.0",
    "starlette>=0.47.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false
