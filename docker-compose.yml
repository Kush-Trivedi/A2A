# Local cloud-parity run: docker compose up --build
# Same images that ship to Container Apps; agent card URLs use service DNS
# names (agents' env yamls point ace.base_url at http://ace:3000 in this mode).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  ace:
    build: { context: ., dockerfile: Dockerfile.ace }
    environment:
      ENV: local
      ACE_DB_POSTGRES_HOST: postgres
      ACE_DB_POSTGRES_USER: postgres
      ACE_DB_POSTGRES_PASSWORD: "12345678"
      ACE_DB_POSTGRES_DBNAME: postgres
    ports: ["3000:3000"]
    depends_on: [postgres]

  general:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: general_agent } }
    ports: ["3300:3300"]
  file-qa:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: file_upload_agent } }
    ports: ["3400:3400"]
  policy-procedure:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: policy_procedure_agent } }
    ports: ["3500:3500"]
  sms:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: sms_agent } }
    ports: ["3700:3700"]
  benefits:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: benefits_agent } }
    ports: ["3800:3800"]
  econsult:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: econsult_agent } }
    ports: ["3900:3900"]
  gda:
    build: { context: ., dockerfile: Agents/Dockerfile, args: { AGENT: gda_agent } }
    ports: ["4000:4000"]

  frontend:
    build: ./ACE/frontend
    ports: ["5173:80"]
    depends_on: [ace]

volumes:
  pgdata:
