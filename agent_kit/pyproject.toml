[project]
name = "ace-agent-kit"
version = "0.1.0"
description = "Shared kit for ACE and ODT team agents: context envelope + cross-agent delegation over A2A"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.1.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ace_agent_kit"]
